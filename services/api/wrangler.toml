name = "yuke-api"
main = "src/index.ts"
compatibility_date = "2026-09-20"

# Public-repository local/CI D1 binding.
# The all-zero UUID is synthetic and is used only because Wrangler requires a
# database_id in configuration. Explicit --local commands use local D1 state.
# Remote deployment must use a controlled config containing the real database ID.
[[d1_databases]]
binding = "DB"
database_name = "yuke-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
migrations_table = "d1_migrations"

# Public-repository local/CI R2 binding. The bucket name is synthetic and only
# used by local Miniflare/Workerd. Production uses controlled deployment config.
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "yuke-avatars-local"
