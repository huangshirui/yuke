name: Feature request
description: 提议产品、工程或开发体验改进
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题 / 场景
      description: 描述希望解决的问题，不要包含真实用户或机构数据。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可说明交互、Contract、架构或实现方向。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如考虑过其他方式，可在此说明。
  - type: checkboxes
    id: safety
    attributes:
      label: 公开信息确认
      options:
        - label: 我确认本 Issue 不包含真实用户数据、凭据或非公开基础设施信息。
          required: true
