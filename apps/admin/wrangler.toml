name = "yuke-admin"
main = "./worker/index.js"
compatibility_date = "2026-09-20"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[services]]
binding = "API"
service = "yuke-api"

[[routes]]
pattern = "yuke.verinasci.com"
custom_domain = true
